<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Multi Vendor Ecommerce</title>
  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f1f5f9;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .login-card{
      width:100%;
      max-width:420px;
      background:white;
      padding:30px;
      border-radius:12px;
      box-shadow:0 6px 18px rgba(0,0,0,0.12);
    }

    h1{
      text-align:center;
      margin-bottom:10px;
      color:#0f172a;
    }

    p{
      text-align:center;
      color:#64748b;
      margin-bottom:20px;
    }

    label{
      display:block;
      margin-top:12px;
      font-weight:bold;
    }

    input, select{
      width:100%;
      padding:10px;
      margin-top:6px;
      border:1px solid #ccc;
      border-radius:6px;
    }

    button{
      width:100%;
      margin-top:18px;
      padding:12px;
      border:none;
      border-radius:6px;
      background:#2563eb;
      color:white;
      font-size:15px;
      cursor:pointer;
    }

    button:hover{
      background:#1d4ed8;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h1>Multi Vendor Ecommerce</h1>
    <p>Login to continue</p>

    <label for="loginName">Name</label>
    <input type="text" id="loginName" placeholder="Enter your name">

    <label for="loginRole">Login As</label>
    <select id="loginRole">
      <option value="">Select role</option>
      <option value="Vendor">Vendor</option>
      <option value="Customer">Customer</option>
      <option value="Admin">Admin</option>
    </select>

    <button onclick="loginUser()">Login</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
